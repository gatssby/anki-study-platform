# Include in the nginx http{} context via /etc/nginx/conf.d/.
# Empty keys are not accounted, so the write bucket applies only to POST.
map $request_method $anki_gpt_write_key {
    default "";
    POST $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=anki_gpt_all:10m rate=20r/s;
limit_req_zone $anki_gpt_write_key zone=anki_gpt_write:10m rate=2r/s;
