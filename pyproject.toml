[project]
name = "anki-study-platform"
version = "0.1.0"
description = "Private modular monorepo for Anki GPT and Cronograma FO"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests", "anki-gpt/tests", "cronograma-fo/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
