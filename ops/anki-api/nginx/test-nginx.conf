# Test harness only; paths resolve on the VPS.
user www-data;
worker_processes 1;
pid /tmp/anki-gpt-nginx-proposed/nginx.pid;

events { worker_connections 128; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    error_log /tmp/anki-gpt-nginx-proposed/error.log;

    include /tmp/anki-gpt-nginx-proposed/00-anki-gpt-rate-limit.conf;
    include /tmp/anki-gpt-nginx-proposed/default-deny.conf;
    include /tmp/anki-gpt-nginx-proposed/gatsby-anki.conf;
    include /etc/nginx/sites-available/n8n.gatssby.com.br;
}
