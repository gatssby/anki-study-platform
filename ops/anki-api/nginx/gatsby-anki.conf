server {
    listen 443 ssl;
    server_name gatsby-anki.137.131.191.66.nip.io;
    server_tokens off;
    client_max_body_size 100m;

    ssl_certificate /etc/letsencrypt/live/gatsby-anki.137.131.191.66.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gatsby-anki.137.131.191.66.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;

    location = /privacy.html {
        root /var/www/gatsby-anki;
    }

    # /anki-sync-test was intentionally removed. There is no listener on 8766.
    location / {
        limit_req zone=anki_gpt_all burst=40 nodelay;
        limit_req zone=anki_gpt_write burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
    }
}

server {
    listen 80;
    server_name gatsby-anki.137.131.191.66.nip.io;
    server_tokens off;
    return 301 https://gatsby-anki.137.131.191.66.nip.io$request_uri;
}
