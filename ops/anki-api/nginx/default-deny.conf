# Replace /etc/nginx/sites-enabled/default after backup.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

# nginx 1.18 predates ssl_reject_handshake. Complete TLS, then reject every
# request for an unknown SNI/Host. The named vhosts remain more specific.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/gatsby-anki.137.131.191.66.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gatsby-anki.137.131.191.66.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 444;
}
