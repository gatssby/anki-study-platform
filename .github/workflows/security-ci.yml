name: Repository Safety

on:
  push:
  pull_request:

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_no_secrets.py
      - run: python scripts/check_large_files.py
